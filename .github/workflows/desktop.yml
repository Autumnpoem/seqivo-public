name: Desktop build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
            artifact: macos
          - os: windows-latest
            bundles: nsis
            artifact: windows
          - os: ubuntu-24.04
            bundles: deb,appimage
            artifact: ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run core tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build
      - name: Prepare Node sidecar and licenses
        run: pnpm desktop:prepare
      - name: Build native package
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}

      - name: Zip macOS app preserving permissions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" tuijin-macos.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: tuijin-${{ matrix.artifact }}
          path: tuijin-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: tuijin-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: tuijin-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

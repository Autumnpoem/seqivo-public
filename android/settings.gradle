pluginManagement {
    repositories {
        def googleMirror = System.getenv('SEQIVO_ANDROID_GOOGLE_MIRROR')
        def mavenMirror = System.getenv('SEQIVO_ANDROID_MAVEN_MIRROR')
        if (googleMirror) maven { url = uri(googleMirror) }
        if (mavenMirror) maven { url = uri(mavenMirror) }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def googleMirror = System.getenv('SEQIVO_ANDROID_GOOGLE_MIRROR')
        def mavenMirror = System.getenv('SEQIVO_ANDROID_MAVEN_MIRROR')
        if (googleMirror) maven { url = uri(googleMirror) }
        if (mavenMirror) maven { url = uri(mavenMirror) }
        google()
        mavenCentral()
    }
}
rootProject.name = 'SeqivoAndroid'
include ':app'

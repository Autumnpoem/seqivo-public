[package]
name = "tuijin"
version = "0.4.1"
description = "序程 Seqivo AI 任务看板"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The app and tauri-runtime-wry must use the same pre-termination hook.
tao = { version = "=0.35.3", default-features = false }

[patch.crates-io]
tao = { path = "vendor/tao-0.35.3" }
